name: Build App Chat

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Tao project
        run: flutter create --org com.example --project-name chat_app chat_build

      - name: Ghi pubspec
        run: |
          cd chat_build
          printf '%s\n' \
            "name: chat_app" \
            "description: Chat App" \
            "publish_to: 'none'" \
            "version: 1.0.0+1" \
            "" \
            "environment:" \
            "  sdk: '>=3.0.0 <4.0.0'" \
            "" \
            "dependencies:" \
            "  flutter:" \
            "    sdk: flutter" \
            "  http: ^1.2.0" \
            "" \
            "dev_dependencies:" \
            "  flutter_test:" \
            "    sdk: flutter" \
            "" \
            "flutter:" \
            "  uses-material-design: true" \
            > pubspec.yaml

      - name: Ghi main.dart
        run: |
          cd chat_build
          cat > lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'dart:async';

          const String FIREBASE_URL = 'https://chat-app-hung-default-rtdb.asia-southeast1.firebasedatabase.app';
          const String EMAILJS_SERVICE_ID = 'service_xd4p0og';
          const String EMAILJS_TEMPLATE_ID = 'template_e75vjj7';
          const String EMAILJS_PUBLIC_KEY = '_ARGVipfVQPmHkUTt';
          const String EMAIL_NHAN = 'hung.luongtien0707@gmail.com';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Chat',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.indigo, useMaterial3: true),
                home: const ChatScreen(),
              );
            }
          }

          class ChatScreen extends StatefulWidget {
            const ChatScreen({super.key});
            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final _controller = TextEditingController();
            final _nameController = TextEditingController(text: 'Khach');
            final _scrollController = ScrollController();
            List<Map<String, dynamic>> _messages = [];
            Timer? _timer;
            int _lastCount = 0;
            bool _loading = true;
            String _lastError = '';
            Map<String, dynamic>? _replyingTo;

            @override
            void initState() {
              super.initState();
              _loadMessages();
              _timer = Timer.periodic(const Duration(seconds: 3), (_) => _loadMessages());
            }

            @override
            void dispose() {
              _timer?.cancel();
              _controller.dispose();
              _nameController.dispose();
              _scrollController.dispose();
              super.dispose();
            }

            String _now() {
              final n = DateTime.now();
              return '${n.hour}:${n.minute.toString().padLeft(2, '0')}';
            }

            // ⭐ LOAD TIN NHẮN TỪ FIREBASE
            Future<void> _loadMessages() async {
              try {
                final r = await http.get(Uri.parse('$FIREBASE_URL/messages.json'));
                if (r.statusCode == 200) {
                  final data = jsonDecode(r.body);
                  if (data == null) {
                    setState(() {
                      _messages = [];
                      _loading = false;
                      _lastError = '';
                    });
                    return;
                  }
                  final Map<String, dynamic> map = Map<String, dynamic>.from(data);
                  final list = map.entries
                      .map((e) => {...Map<String, dynamic>.from(e.value), 'id': e.key})
                      .toList();
                  list.sort((a, b) => (a['timestamp'] ?? 0).compareTo(b['timestamp'] ?? 0));
                  setState(() {
                    _messages = list;
                    _loading = false;
                    _lastError = '';
                  });
                  // Thông báo tin mới
                  if (list.length > _lastCount && _lastCount > 0) {
                    final newest = list.last;
                    if (mounted) {
                      ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                        content: Text('Tin moi tu ${newest['user']}'),
                        backgroundColor: Colors.indigo,
                        duration: const Duration(seconds: 2),
                      ));
                    }
                  }
                  _lastCount = list.length;
                } else {
                  setState(() {
                    _loading = false;
                    _lastError = 'HTTP ${r.statusCode}';
                  });
                }
              } catch (e) {
                setState(() {
                  _loading = false;
                  _lastError = '$e';
                });
              }
            }

            Future<void> _guiFirebase(Map<String, dynamic> payload) async {
              try {
                await http.post(
                  Uri.parse('$FIREBASE_URL/messages.json'),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode(payload),
                );
              } catch (e) {
                print('LOI FIREBASE: $e');
              }
            }

            Future<void> _guiEmail(String ten, String text, Map<String, dynamic>? reply) async {
              try {
                String noiDung = text;
                if (reply != null) {
                  noiDung = '[Tra loi ' + (reply['text'] ?? '') + ' cua ' + (reply['user'] ?? '') + ']\n\n' + text;
                }
                await http.post(
                  Uri.parse('https://api.emailjs.com/api/v1.0/email/send'),
                  headers: {'Content-Type': 'application/json', 'origin': 'http://localhost'},
                  body: jsonEncode({
                    'service_id': EMAILJS_SERVICE_ID,
                    'template_id': EMAILJS_TEMPLATE_ID,
                    'user_id': EMAILJS_PUBLIC_KEY,
                    'template_params': {
                      'from_name': ten,
                      'message': noiDung,
                      'time': _now(),
                      'to_email': EMAIL_NHAN,
                    },
                  }),
                );
              } catch (e) {
                print('LOI EMAIL: $e');
              }
            }

            void _send() {
              final text = _controller.text.trim();
              if (text.isEmpty) return;
              final ten = _nameController.text.trim().isEmpty ? 'Khach' : _nameController.text.trim();
              final replySnapshot = _replyingTo;

              final payload = {
                'user': ten,
                'text': text,
                'time': _now(),
                'timestamp': DateTime.now().millisecondsSinceEpoch,
              };
              if (replySnapshot != null) {
                payload['replyToUser'] = replySnapshot['user'];
                payload['replyToText'] = replySnapshot['text'];
              }

              _guiFirebase(payload);
              _guiEmail(ten, text, replySnapshot);
              _controller.clear();
              setState(() => _replyingTo = null);

              Future.delayed(const Duration(milliseconds: 500), () {
                _loadMessages();
                _scrollToBottom();
              });
            }

            void _scrollToBottom() {
              Future.delayed(const Duration(milliseconds: 100), () {
                if (_scrollController.hasClients) {
                  _scrollController.animateTo(
                    _scrollController.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 200),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            Widget _buildMessage(Map<String, dynamic> m) {
              final isMe = m['user'] != 'Bot' && m['user'] != 'Admin';
              final isReply = m['replyToText'] != null;
              return Align(
                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                child: Container(
                  margin: const EdgeInsets.symmetric(vertical: 4),
                  padding: const EdgeInsets.fromLTRB(12, 10, 6, 10),
                  constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.8),
                  decoration: BoxDecoration(
                    color: isMe ? Colors.indigo : (m['user'] == 'Admin' ? Colors.amber.shade100 : Colors.grey[200]),
                    borderRadius: BorderRadius.circular(16),
                  ),
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Flexible(
                        child: Column(
                          crossAxisAlignment: isMe ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Text(m['user'] ?? '',
                                    style: TextStyle(
                                        fontSize: 11,
                                        fontWeight: FontWeight.bold,
                                        color: isMe ? Colors.white70 : Colors.black54)),
                                if (isReply) ...[
                                  const SizedBox(width: 4),
                                  Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),
                                    decoration: BoxDecoration(
                                      color: Colors.amber.shade200,
                                      borderRadius: BorderRadius.circular(3),
                                    ),
                                    child: const Text('Reply',
                                        style: TextStyle(fontSize: 9, color: Colors.orange, fontWeight: FontWeight.bold)),
                                  ),
                                ],
                              ],
                            ),
                            const SizedBox(height: 4),
                            if (isReply)
                              Container(
                                margin: const EdgeInsets.only(bottom: 6),
                                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                                decoration: BoxDecoration(
                                  color: isMe ? Colors.white24 : Colors.black12,
                                  borderRadius: BorderRadius.circular(8),
                                  border: Border(
                                      left: BorderSide(
                                          color: isMe ? Colors.amber : Colors.indigo, width: 3)),
                                ),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(m['replyToUser'] ?? '',
                                        style: TextStyle(
                                            fontSize: 11,
                                            fontWeight: FontWeight.bold,
                                            color: isMe ? Colors.amber : Colors.indigo)),
                                    const SizedBox(height: 2),
                                    Text(m['replyToText'] ?? '',
                                        maxLines: 2,
                                        overflow: TextOverflow.ellipsis,
                                        style: TextStyle(
                                            fontSize: 13,
                                            fontStyle: FontStyle.italic,
                                            color: isMe ? Colors.white70 : Colors.black54)),
                                  ],
                                ),
                              ),
                            Text(m['text'] ?? '',
                                style: TextStyle(
                                    color: isMe ? Colors.white : Colors.black87, fontSize: 15)),
                            const SizedBox(height: 4),
                            Text(m['time'] ?? '',
                                style: TextStyle(
                                    fontSize: 10,
                                    color: isMe ? Colors.white60 : Colors.black38)),
                          ],
                        ),
                      ),
                      const SizedBox(width: 4),
                      Material(
                        color: Colors.transparent,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(20),
                          onTap: () => setState(() => _replyingTo = m),
                          child: Padding(
                            padding: const EdgeInsets.all(6),
                            child: Icon(Icons.reply,
                                size: 20, color: isMe ? Colors.white70 : Colors.indigo),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Chat (Nguoi gui)'),
                  backgroundColor: Colors.indigo,
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh), onPressed: _loadMessages),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(8),
                      color: Colors.indigo.shade50,
                      child: TextField(
                        controller: _nameController,
                        decoration: const InputDecoration(
                            labelText: 'Ten cua ban',
                            border: OutlineInputBorder(),
                            isDense: true,
                            contentPadding:
                                EdgeInsets.symmetric(horizontal: 12, vertical: 10)),
                      ),
                    ),
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                      color: Colors.indigo.shade50,
                      child: Row(
                        children: [
                          const Icon(Icons.wifi_tethering, color: Colors.indigo, size: 14),
                          const SizedBox(width: 6),
                          Expanded(
                            child: Text('Dang lang nghe... (${_messages.length} tin nhan)',
                                style: const TextStyle(
                                    color: Colors.indigo,
                                    fontWeight: FontWeight.bold,
                                    fontSize: 12)),
                          ),
                          if (_loading)
                            const SizedBox(
                                width: 12,
                                height: 12,
                                child: CircularProgressIndicator(
                                    strokeWidth: 2, color: Colors.indigo)),
                          if (_lastError.isNotEmpty)
                            Text('Loi: $_lastError',
                                style: const TextStyle(color: Colors.red, fontSize: 10)),
                        ],
                      ),
                    ),
                    Expanded(
                      child: _messages.isEmpty
                          ? const Center(
                              child: Text('Chua co tin nhan nao',
                                  style: TextStyle(color: Colors.grey)),
                            )
                          : RefreshIndicator(
                              onRefresh: _loadMessages,
                              child: ListView.builder(
                                controller: _scrollController,
                                padding: const EdgeInsets.all(12),
                                itemCount: _messages.length,
                                itemBuilder: (_, i) => _buildMessage(_messages[i]),
                              ),
                            ),
                    ),
                    if (_replyingTo != null)
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        color: Colors.indigo.shade50,
                        child: Row(
                          children: [
                            Container(
                                width: 3,
                                height: 36,
                                color: Colors.indigo,
                                margin: const EdgeInsets.only(right: 8)),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text('Dang tra loi ${_replyingTo!['user']}',
                                      style: const TextStyle(
                                          fontSize: 12,
                                          fontWeight: FontWeight.bold,
                                          color: Colors.indigo)),
                                  const SizedBox(height: 2),
                                  Text(_replyingTo!['text'] ?? '',
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(
                                          fontSize: 13, color: Colors.black54)),
                                ],
                              ),
                            ),
                            IconButton(
                                icon: const Icon(Icons.close, color: Colors.grey),
                                onPressed: () => setState(() => _replyingTo = null)),
                          ],
                        ),
                      ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(8),
                        child: Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _controller,
                                decoration: InputDecoration(
                                  hintText: _replyingTo != null
                                      ? 'Tra loi ${_replyingTo!['user']}...'
                                      : 'Nhap tin nhan...',
                                  border: OutlineInputBorder(
                                      borderRadius: BorderRadius.circular(24)),
                                  contentPadding: const EdgeInsets.symmetric(
                                      horizontal: 16, vertical: 12),
                                ),
                                onSubmitted: (_) => _send(),
                              ),
                            ),
                            const SizedBox(width: 8),
                            CircleAvatar(
                              radius: 24,
                              backgroundColor: Colors.indigo,
                              child: IconButton(
                                  icon: const Icon(Icons.send, color: Colors.white),
                                  onPressed: _send),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          ENDDART

      - name: Quyen Internet
        run: |
          cd chat_build
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd chat_build
          flutter pub get
          flutter build apk --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: app-chat-apk
          path: chat_build/build/app/outputs/flutter-apk/app-release.apk
