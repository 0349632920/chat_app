name: Build App Chat

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Tạo project Chat
        run: |
          flutter create --org com.example --project-name chat_app chat_app_build
          cd chat_app_build

          cat > pubspec.yaml << 'EOF'
          name: chat_app
          description: Chat App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';

          const String FIREBASE_URL = 'https://chat-app-hung-default-rtdb.asia-southeast1.firebasedatabase.app';
          const String EMAILJS_SERVICE_ID = 'service_xd4p0og';
          const String EMAILJS_TEMPLATE_ID = 'template_e75vjj7';
          const String EMAILJS_PUBLIC_KEY = '_ARGVipfVQPmHkUTt';
          const String EMAIL_NHAN = 'hung.luongtien0707@gmail.com';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Chat',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.indigo, useMaterial3: true),
                home: const ChatScreen(),
              );
            }
          }

          class Message {
            final String id;
            final String user;
            final String text;
            final String time;
            final String? replyToUser;
            final String? replyToText;

            Message({
              required this.id,
              required this.user,
              required this.text,
              required this.time,
              this.replyToUser,
              this.replyToText,
            });

            bool get isReply => replyToText != null;
          }

          class ChatScreen extends StatefulWidget {
            const ChatScreen({super.key});
            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final _controller = TextEditingController();
            final _nameController = TextEditingController(text: 'Khach');
            final _scrollController = ScrollController();
            final List<Message> _messages = [];
            Message? _replyingTo;

            @override
            void initState() {
              super.initState();
              _messages.add(Message(
                id: '0',
                user: 'Bot',
                text: 'Xin chao! Giu vao tin nhan de tra loi.',
                time: _now(),
              ));
            }

            String _now() {
              final n = DateTime.now();
              return '${n.hour}:${n.minute.toString().padLeft(2, '0')}';
            }

            Future<void> _guiFirebase(Message msg) async {
              try {
                final url = '$FIREBASE_URL/messages.json';
                final Map<String, dynamic> payload = {
                  'user': msg.user,
                  'text': msg.text,
                  'time': msg.time,
                  'timestamp': DateTime.now().millisecondsSinceEpoch,
                };
                if (msg.isReply) {
                  payload['replyToUser'] = msg.replyToUser;
                  payload['replyToText'] = msg.replyToText;
                }
                final r = await http.post(
                  Uri.parse(url),
                  headers: {'Content-Type': 'application/json'},
                  body: jsonEncode(payload),
                );
                print('FIREBASE STATUS: ${r.statusCode}');
              } catch (e) {
                print('LOI FIREBASE: $e');
              }
            }

            Future<void> _guiEmail(Message msg) async {
              try {
                String noiDung = msg.text;
                if (msg.isReply) {
                  noiDung = '[Tra loi "${msg.replyToText}" cua ${msg.replyToUser}]\n\n${msg.text}';
                }
                await http.post(
                  Uri.parse('https://api.emailjs.com/api/v1.0/email/send'),
                  headers: {'Content-Type': 'application/json', 'origin': 'http://localhost'},
                  body: jsonEncode({
                    'service_id': EMAILJS_SERVICE_ID,
                    'template_id': EMAILJS_TEMPLATE_ID,
                    'user_id': EMAILJS_PUBLIC_KEY,
                    'template_params': {
                      'from_name': msg.user,
                      'message': noiDung,
                      'time': '${msg.time} ${DateTime.now().day}/${DateTime.now().month}/${DateTime.now().year}',
                      'to_email': EMAIL_NHAN,
                    },
                  }),
                );
                print('DA GUI EMAIL');
              } catch (e) {
                print('LOI EMAIL: $e');
              }
            }

            void _send() {
              final text = _controller.text.trim();
              if (text.isEmpty) return;
              final ten = _nameController.text.trim().isEmpty ? 'Khach' : _nameController.text.trim();
              final replySnapshot = _replyingTo;

              final msg = Message(
                id: DateTime.now().millisecondsSinceEpoch.toString(),
                user: ten,
                text: text,
                time: _now(),
                replyToUser: replySnapshot?.user,
                replyToText: replySnapshot?.text,
              );

              setState(() {
                _messages.add(msg);
                _replyingTo = null;
              });

              _guiFirebase(msg);
              _guiEmail(msg);
              _controller.clear();
              _scrollToBottom();

              Future.delayed(const Duration(milliseconds: 500), () {
                setState(() {
                  _messages.add(Message(
                    id: DateTime.now().millisecondsSinceEpoch.toString(),
                    user: 'Bot',
                    text: msg.isReply ? 'Da gui reply den app Nhan tin nhan' : 'Da gui den app Nhan tin nhan',
                    time: _now(),
                  ));
                });
                _scrollToBottom();
              });
            }

            void _scrollToBottom() {
              Future.delayed(const Duration(milliseconds: 100), () {
                if (_scrollController.hasClients) {
                  _scrollController.animateTo(
                    _scrollController.position.maxScrollExtent,
                    duration: const Duration(milliseconds: 200),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            void _showMessageMenu(Message m) {
              showModalBottomSheet(
                context: context,
                builder: (_) => SafeArea(
                  child: Wrap(
                    children: [
                      ListTile(
                        leading: const Icon(Icons.reply, color: Colors.indigo),
                        title: const Text('Tra loi'),
                        onTap: () {
                          Navigator.pop(context);
                          setState(() => _replyingTo = m);
                        },
                      ),
                      ListTile(
                        leading: const Icon(Icons.close, color: Colors.grey),
                        title: const Text('Dong'),
                        onTap: () => Navigator.pop(context),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildMessage(Message m) {
              final isMe = m.user != 'Bot';
              return Align(
                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                child: GestureDetector(
                  onLongPress: () => _showMessageMenu(m),
                  child: Container(
                    margin: const EdgeInsets.symmetric(vertical: 4),
                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                    constraints: BoxConstraints(
                      maxWidth: MediaQuery.of(context).size.width * 0.75,
                    ),
                    decoration: BoxDecoration(
                      color: isMe ? Colors.indigo : Colors.grey[200],
                      borderRadius: BorderRadius.circular(16),
                    ),
                    child: Column(
                      crossAxisAlignment: isMe ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                      children: [
                        Text(m.user,
                            style: TextStyle(
                                fontSize: 11,
                                fontWeight: FontWeight.bold,
                                color: isMe ? Colors.white70 : Colors.black54)),
                        const SizedBox(height: 4),
                        if (m.isReply)
                          Container(
                            margin: const EdgeInsets.only(bottom: 6),
                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                            decoration: BoxDecoration(
                              color: isMe ? Colors.white24 : Colors.black12,
                              borderRadius: BorderRadius.circular(8),
                              border: Border(
                                left: BorderSide(
                                  color: isMe ? Colors.amber : Colors.indigo,
                                  width: 3,
                                ),
                              ),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Row(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    Icon(Icons.reply,
                                        size: 12,
                                        color: isMe ? Colors.amber : Colors.indigo),
                                    const SizedBox(width: 4),
                                    Text(m.replyToUser ?? '',
                                        style: TextStyle(
                                            fontSize: 11,
                                            fontWeight: FontWeight.bold,
                                            color: isMe ? Colors.amber : Colors.indigo)),
                                  ],
                                ),
                                const SizedBox(height: 2),
                                Text(m.replyToText ?? '',
                                    maxLines: 2,
                                    overflow: TextOverflow.ellipsis,
                                    style: TextStyle(
                                        fontSize: 13,
                                        fontStyle: FontStyle.italic,
                                        color: isMe ? Colors.white70 : Colors.black54)),
                              ],
                            ),
                          ),
                        Text(m.text,
                            style: TextStyle(
                                color: isMe ? Colors.white : Colors.black87, fontSize: 15)),
                        const SizedBox(height: 4),
                        Text(m.time,
                            style: TextStyle(
                                fontSize: 10,
                                color: isMe ? Colors.white60 : Colors.black38)),
                      ],
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Chat (Nguoi gui)'),
                  backgroundColor: Colors.indigo,
                  foregroundColor: Colors.white,
                ),
                body: Column(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(8),
                      color: Colors.indigo.shade50,
                      child: TextField(
                        controller: _nameController,
                        decoration: const InputDecoration(
                          labelText: 'Ten cua ban',
                          border: OutlineInputBorder(),
                          isDense: true,
                          contentPadding: EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                        ),
                      ),
                    ),
                    Expanded(
                      child: ListView.builder(
                        controller: _scrollController,
                        padding: const EdgeInsets.all(12),
                        itemCount: _messages.length,
                        itemBuilder: (_, i) => _buildMessage(_messages[i]),
                      ),
                    ),
                    if (_replyingTo != null)
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                        color: Colors.indigo.shade50,
                        child: Row(
                          children: [
                            Container(
                              width: 3,
                              height: 36,
                              color: Colors.indigo,
                              margin: const EdgeInsets.only(right: 8),
                            ),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Row(
                                    children: [
                                      const Icon(Icons.reply, size: 14, color: Colors.indigo),
                                      const SizedBox(width: 4),
                                      Text('Dang tra loi ${_replyingTo!.user}',
                                          style: const TextStyle(
                                              fontSize: 12,
                                              fontWeight: FontWeight.bold,
                                              color: Colors.indigo)),
                                    ],
                                  ),
                                  const SizedBox(height: 2),
                                  Text(_replyingTo!.text,
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(fontSize: 13, color: Colors.black54)),
                                ],
                              ),
                            ),
                            IconButton(
                              icon: const Icon(Icons.close, color: Colors.grey),
                              onPressed: () => setState(() => _replyingTo = null),
                            ),
                          ],
                        ),
                      ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(8),
                        child: Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _controller,
                                decoration: InputDecoration(
                                  hintText: _replyingTo != null
                                      ? 'Tra loi ${_replyingTo!.user}...'
                                      : 'Nhap tin nhan...',
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(24)),
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                                ),
                                onSubmitted: (_) => _send(),
                              ),
                            ),
                            const SizedBox(width: 8),
                            CircleAvatar(
                              radius: 24,
                              backgroundColor: Colors.indigo,
                              child: IconButton(
                                  icon: const Icon(Icons.send, color: Colors.white),
                                  onPressed: _send),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART_EOF

      - name: Thêm quyền Internet
        run: |
          cd chat_app_build
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd chat_app_build
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-chat-apk
          path: chat_app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
